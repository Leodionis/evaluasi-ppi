IS KEGIATAN", "row": 54}, {"id": "7-a-56", "std": "7", "ep": "a", "ep_text": "Rumah sakit telah menerapkan pengelolaan limbah rumah sakit untuk meminimalkan risiko infeksi yang meliputi a) – e) pada maksud dan tujuan.", "jenis": "D", "bukti": "Bukti penerapan pengelolaan limbah rumah sakit untuk meminimalkan risiko infeksi, meliputi a) – e) pada maksud dan tujuan.", "warna": "merah", "perbaikan": "BACA KEMBALI TERKAIT REGULASI INI, LIHAT POINT STARKAS", "row": 56}, {"id": "7-b-60", "std": "7", "ep": "b", "ep_text": "Penanganan dan pembuangan darah serta komponen darah sesuai dengan regulasi, dipantau dan dievaluasi, serta di tindak lanjutnya.", "jenis": "", "bukti": "2. Bukti pemantauan dan evaluasi serta tindak lanjut (hasil audit).", "warna": "merah", "perbaikan": "BELUM ADA DI UPLOAD", "row": 60}, {"id": "7-d-65", "std": "7", "ep": "d", "ep_text": "Bila pengelolaan limbah dilaksanakan oleh pihak luar rumah sakit harus berdasar atas kerjasama dengan pihak yang memiliki izin dan sertifikasi mutu sesuai dengan peraturan perundang-undangan.", "jenis": "D", "bukti": "Dokumen bukti : 1. Kerjasama dengan pihak transporter dan pengolah B3. 2. Izin transporter. 3. Izin pengolah B3. 4. Sertifikat mutu.", "warna": "merah", "perbaikan": "SUDAH ADA ( INI BARU ADA IZIN PENGOLAH B3) ADAKAH IZIN SAA PIHAK LUAR LAINNYA", "row": 65}, {"id": "7.1-a-67", "std": "7.1", "ep": "a", "ep_text": "Pemulasaraan jenazah dan bedah mayat sesuai dengan regulasi.", "jenis": "D", "bukti": "Laporan kegiatan pemulasaran jenazah dan bedah mayat.", "warna": "merah", "perbaikan": "BELUM ADA LAPORAN KEGIATAN KONKRIT, MISALNYA TAHUN 026 INI BERAPA JUMLAH JENAZAH, ADAKAH KEGIATAN ATAU TINDAKAN YANG DIBEIRKAN PADA JEZAAH MISALNYA PENYUNTIKAM FORMALIN DLL..YANG DIALMPIRKAN BARU FOTO KEGIATAN SAJA", "row": 67}, {"id": "7.1-c-71", "std": "7.1", "ep": "c", "ep_text": "Ada bukti pemantauan dan evaluasi, serta tindak lanjut kepatuhan prinsip-prinsip PPI sesuai dengan peraturan perundang-undangan.", "jenis": "D" }, {"id": "8-b-83", "std": "8", "ep": "b", "ep_text": "Ada bukti pelaksanaan penyimpanan bahan makanan, pengolahan, pembagian/ pemorsian, dan distribusi makanan sudah sesuai dengan peraturan perundang-undangan.", "jenis": "D", "bukti": "Pemantauan suhu dan kelembaban.", "warna": "merah", "perbaikan": "TIDAK ADA BUKTI PEMANTAUAN", "row": 83}, {"id": "8-c-86", "std": "8", "ep": "c", "ep_text": "Ada bukti pelaksanaan penyimpanan makanan dan produk nutrisi dengan memperhatikan kesehatan lingkungan meliputi sanitasi, suhu, pencahayaan, kelembapan, ventilasi, dan keamanan untuk mengurangi risiko infeksi.", "jenis": "D", "bukti": "Pemantauan suhu dan kelembaban.", "warna": "merah", "perbaikan": "TIDAK ADA BUKTI PEMANTAUAN", "row": 86}, {"id": "10-b-97", "std": "10", "ep": "b", "ep_text": "Rumah sakit melaksanakan proses transfer pasien airborne diseases di dalam rumah sakit dan keluar rumah sakit sesuai dengan peraturan perundang- undangan termasuk di ruang gawat darurat dan ruang lainnya.", "jenis": "O", "bukti": "Pelaksanaan proses transfer pasien airborne diseases di dalam rumah sakit dan keluar rumah sakit termasuk di ruang gawat darurat dan ruang lainnya. Lihat AKP 4.", "warna": "kuning", "perbaikan": "BUKTII NANTI KEGIATAN SEPERTI APA", "row": 97}, {"id": "10-c-99", "std": "10", "ep": "c", "ep_text": "Rumah sakit telah menempatkan pasien infeksi “air borne” dalam waktu singkat jika rumah sakit tidak mempunyai kamar dengan tekanan negatif sesuai dengan peraturan perundang-undangan termasuk di ruang gawat darurat dan ruang lainnya.", "jenis": "O", "bukti": "Ketersediaan ruang isolasi untuk pasien infeksi “air borne” dalam waktu singkat jika rumah sakit tidak mempunyai kamar dengan tekanan negatif termasuk di ruang gawat darurat dan ruang lainnya.", "warna": "kuning", "perbaikan": "BUKTII NANTI KEGIATAN SEPERTI APA", "row": 99}, {"id": "10-d-101", "std": "10", "ep": "d", "ep_text": "Ada bukti pemantauan ruang tekanan negatif dan penempatan pasien secara rutin.", "jenis": "D", "bukti": "Bukti pemantauan ruang tekanan negative. (hasil audit).", "warna": "merah", "perbaikan": "BUKTI PEMANTAUAN APA, TAPI LAPORAN KEGIATAN AUDITNYA MANA", "row": 101}, {"id": "10.1-a-105", "std": "10.1", "ep": "a", "ep_text": "Rumah sakit menerapkan proses pengelolaan pasien bila terjadi ledakan pasien (outbreak) penyakit infeksi air borne.", "jenis": "D", "bukti": "Bukti penerapan proses pengelolaan pasien bila terjadi ledakan pasien (outbreak) penyakit infeksi air borne.", "warna": "kuning", "perbaikan": "JIKA ADA KEGIATANNYA DILAMPIRKAN", "row": 105}, {"id": "10.1-b-107", "std": "10.1", "ep": "b", "ep_text": "Rumah sakit menyediakan ruang isolasi dengan tekanan negatif bila terjadi ledakan pasien (outbreak) sesuai dengan peraturan perundangan.", "jenis": "O", "bukti": "Ruang isolasi dengan tekanan negatif bila terjadi ledakan pasien (outbreak).", "warna": "kuning", "perbaikan": "SUDAH ADA", "row": 107}, {"id": "11-a-111", "std": "11", "ep": "a", "ep_text": "Rumah sakit telah menerapkan hand hygiene yang mencakup kapan, di mana, dan bagaimana melakukan cuci tangan mempergunakan sabun (hand wash) dan atau dengan disinfektan (hand rubs) serta ketersediaan fasilitas hand hygiene.", "jenis": "O", "bukti": "Penerapan 5 momen hand hygiene.", "warna": "merah", "perbaikan": "LAPORAN KEGIATAN AUDIT CUCI TANGAN OLEH PPI TOLONG DI UPLOAD", "row": 111}, {"id": "11-b-114", "std": "11", "ep": "b", "ep_text": "Sabun, disinfektan, serta tissu/handuk sekali pakai tersedia di tempat cuci tangan dan tempat melakukan disinfeksi tangan.", "jenis": "O", "bukti": "Ketersediaan sabun, disinfektan, serta tissu/handuk sekali pakai tersedia di tempat cuci tangan dan tempat melakukan disinfeksi tangan.", "warna": "kuning", "perbaikan": "TOLONG DILENGKAPI", "row": 114}, {"id": "11.1-c-124", "std": "11.1", "ep": "c", "ep_text": "Ketersediaan alat pelindung diri sudah cukup sesuai dengan regulasi.", "jenis": "O", "bukti": "Ketersediaan alat pelindung diri dalam jumlah yang cukup.", "warna": "kuning", "perbaikan": "PASTIKAN ADA", "row": 124}, {"id": "12-c-131", "std": "12", "ep": "c", "ep_text": "Ada bukti penyampaian hasil analisis data dan rekomendasi Komite/Tim PPI kepada Komite/ Tim Penyelenggara Mutu setiap tiga bulan.", "jenis": "D", "bukti": "Bukti hasil analisis data dan rekomendasi Komite/Tim PPI kepada Komite/ Tim Penyelenggara Mutu setiap tiga bulan.", "warna": "merah", "perbaikan": "HASIL ANALISA DAN TINDAK LANJUT DARI LAPORAN ITU APA, BUAT DALAM BENTUK WORD", "row": 131}];
const KEY="ppi-checklist-v1";
let st={done:{},note:{}},filter="semua";
try{const s=localStorage.getItem(KEY);if(s)st=JSON.parse(s)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const F=[["semua","Semua"],["merah","Merah"],["kuning","Kuning"],["belum","Belum selesai"],["selesai","Selesai"]];
function render(){
  const n=DATA.length,d=DATA.filter(i=>st.done[i.id]).length;
  const m=DATA.filter(i=>i.warna=="merah"),k=DATA.filter(i=>i.warna=="kuning");
  document.getElementById("stats").innerHTML=`<span>Total <b>${n}</b></span><span>Merah <b>${m.filter(i=>st.done[i.id]).length}/${m.length}</b></span><span>Kuning <b>${k.filter(i=>st.done[i.id]).length}/${k.length}</b></span>`;
  document.getElementById("fill").style.width=(d/n*100)+"%";
  document.getElementById("pct").innerHTML=`<span><b>${d}</b> dari ${n} selesai (${Math.round(d/n*100)}%)</span>`;
  document.getElementById("filters").innerHTML=F.map(([v,l])=>`<button class="chip" aria-pressed="${filter==v}" data-f="${v}">${l}</button>`).join("")+`<button class="chip reset" id="rs">Reset</button>`;
  const vis=DATA.filter(i=>filter=="semua"||filter==i.warna||(filter=="belum"&&!st.done[i.id])||(filter=="selesai"&&st.done[i.id]));
  let out="",cur=null;
  for(const i of vis){
    if(i.std!==cur){cur=i.std;out+=`<h2>Standar ${esc(i.std)}</h2>`}
    const dn=!!st.done[i.id];
    out+=`<div class="item ${i.warna}${dn?" done":""}"><label class="row"><input type="checkbox" data-id="${i.id}" ${dn?"checked":""}><span><span class="tag t-no">No ${esc(i.std)} / EP ${esc(i.ep)}</span><span class="tag t-${i.warna}">${i.warna=="merah"?"Merah":"Kuning"}</span>${i.jenis?`<span class="tag t-no">${esc(i.jenis)}</span>`:""}<div class="fix">${esc(i.perbaikan)}</div></span></label>
    <details><summary>Lihat elemen penilaian dan bukti</summary><p><b>Elemen penilaian:</b> ${esc(i.ep_text)}</p>${i.bukti?`<p><b>Kelengkapan bukti:</b> ${esc(i.bukti)}</p>`:""}<p>Baris Excel: ${i.row}</p></details>
    <textarea data-note="${i.id}" placeholder="Catatan perbaikan (opsional)">${esc(st.note[i.id]||"")}</textarea></div>`;
  }
  document.getElementById("list").innerHTML=out||'<div class="empty">Tidak ada butir pada filter ini.</div>';
}
document.addEventListener("click",e=>{
  const f=e.target.closest("[data-f]");if(f){filter=f.dataset.f;render()}
  if(e.target.id=="rs"&&confirm("Hapus semua centang dan catatan?")){st={done:{},note:{}};save();render()}
});
document.addEventListener("change",e=>{const id=e.target.dataset.id;if(id){st.done[id]=e.target.checked;save();render()}});
document.addEventListener("input",e=>{const id=e.target.dataset.note;if(id){st.note[id]=e.target.value;save()}});
render();
</script></body></html>
